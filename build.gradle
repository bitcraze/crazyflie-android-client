buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
    }
}
allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
apply plugin: 'com.android.application'

android {

    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    useLibrary 'org.apache.http.legacy'

    namespace "se.bitcraze.crazyfliecontrol2"

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test {
            java.srcDirs = ['test/java']
            resources.srcDirs = ['test/resources']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        // Bootloader tests use Android only through the SLF4J logging backend.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.slf4j:slf4j-android:1.6.1-RC1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.6.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.6.3'
    testImplementation 'junit:junit:4.13.2'
}
